name: webview_in_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.9.0
  path_provider: ^2.1.0
  http: ^1.2.0
  english_words: ^4.0.0
  provider: ^6.1.5
  shared_preferences: 2.5.3
  cryptography: ^2.7.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

# Temporary workaround for missing files in FlutLab's hosted pub cache.
dependency_overrides:
  collection:
    path: vendor/collection

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/www/index.html
    - assets/www/styles/style.css